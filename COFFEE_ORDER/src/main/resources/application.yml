spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop # 시작시 크리에트 하고 닫으면 사라짐
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true
        format_sql: true
    # open-in-view는 jpa 바로 아래에 위치해야 합니다.
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug
    # Hibernate 6.x 버전 기준 파라미터 바인딩 확인용
    org.hibernate.orm.results: trace